model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 256
    feature_size: 6
    # T=256 with only 6 channels: long horizon needs depth for the interpretable
    # trend/seasonal decomposition; 2 layers underfit. 4/4 is a middle ground that
    # gives capacity without overfitting on ~2000 rolling windows.
    n_layer_enc: 4
    n_layer_dec: 4
    d_model: 96  # 4 x 24; must be divisible by n_heads.
    timesteps: 500
    sampling_timesteps: 500  # full DDPM at sampling time for fidelity
    loss_type: 'l1'          # robust to fat-tailed log-return residuals
    beta_schedule: 'cosine'  # better than linear for long T (paper default)
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 1
    padding_size: 0

solver:
  # NOTE: `max_epochs` is misnamed — it is the number of optimizer steps
  # (engine/solver.py:30). With 2000 windows / batch 100 / grad_accum 2,
  # one opt step consumes 200 samples, so 12000 steps ≈ 1200 data epochs.
  # Paper-scale runs for T=256 use 10-25k steps; 12k is a balanced middle.
  base_lr: 1.0e-6           # starting LR; scheduler ramps to warmup_lr over `warmup` steps
  max_epochs: 12000
  results_folder: ./Checkpoints_indices2
  gradient_accumulate_every: 2
  save_cycle: 100           # checkpoint every 100 steps; best picked by EMD afterwards
  ema:
    decay: 0.995
    update_interval: 10

  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 1000        # ~ max_epochs / 12; well below total so plateau can trigger
      min_lr: 1.0e-6        # floor for reductions (must be < warmup_lr to leave room)
      threshold: 1.0e-3     # 0.1% rel improvement — standard, not the loose 1e-1
      threshold_mode: rel
      warmup_lr: 2.0e-4     # peak LR after warmup; conservative for 6-feat / 2k-window data
      warmup: 1000          # ~8% of total steps; long enough to stabilize, finishes well before end
      verbose: False

dataloader:
  # Custom log-return + rolling-window pipeline (see main2.py).
  # Train/test arrays are pre-built as (N, 6, 256) .npy files.
  # data_root is resolved relative to the module dir -> repo-root data/indices.csv
  data_root: ../../data/indices.csv
  npy_dir: ./Data/indices2_npy
  train_name: indices2_train.npy
  test_name: indices2_test.npy
  seq_length: 256
  train_ratio: 0.7
  target_n: 2000
  auto_norm: True

  batch_size: 100
  sample_size: 100
  shuffle: True
